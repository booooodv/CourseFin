name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.2). Leave empty to use the latest v* git tag.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12.21.0"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "web/pnpm-lock.yaml"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Resolve release version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="$(printf '%s' "${INPUT_TAG}" | tr -d '[:space:]')"
            if [ -z "$TAG" ]; then
              if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ -n "${GITHUB_REF_NAME:-}" ]; then
                TAG="${GITHUB_REF_NAME}"
              else
                TAG="$(git describe --tags --abbrev=0 --match 'v*')"
              fi
            fi
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          TAG="$(printf '%s' "$TAG" | tr -d '[:space:]')"
          case "$TAG" in
            v*) ;;
            *) TAG="v${TAG}" ;;
          esac
          VERSION="${TAG#v}"
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'; then
            echo "Invalid release version derived from tag '$TAG': '$VERSION'" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and sync Web SPA
        run: |
          set -eu
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build
          rm -rf internal/server/webdist/*
          cp -R web/dist/* internal/server/webdist/

      - name: Build release archives and checksums
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -eu
          rm -rf dist
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            OS="${target%/*}"
            ARCH="${target#*/}"
            STAGE_DIR="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$OS" GOARCH="$ARCH" go build \
              -trimpath \
              -ldflags="-s -w -X main.version=${VERSION}" \
              -o "${STAGE_DIR}/coursefin" \
              ./cmd/coursefin
            chmod 0755 "${STAGE_DIR}/coursefin"
            tar -C "$STAGE_DIR" -czf "dist/coursefin_${VERSION}_${OS}_${ARCH}.tar.gz" coursefin
            rm -rf "$STAGE_DIR"
          done
          (
            cd dist
            sha256sum coursefin_*.tar.gz > checksums.txt
          )

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: CourseFin ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/coursefin_*.tar.gz
            dist/checksums.txt
