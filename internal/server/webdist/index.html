<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CourseFin - 私有课程库与学习中心</title>
    <script>
      (function () {
        var mode = 'system';
        try {
          var saved = localStorage.getItem('coursefin_theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') {
            mode = saved;
          }
        } catch (e) {}
        var resolved =
          mode === 'dark' ||
          (mode === 'system' &&
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches)
            ? 'dark'
            : 'light';
        var root = document.documentElement;
        root.dataset.theme = resolved;
        root.classList.toggle('dark', resolved === 'dark');
        root.style.colorScheme = resolved;
      })();
    </script>
    <script type="module" crossorigin src="/web/assets/index-D-dWeW3D.js"></script>
    <link rel="stylesheet" crossorigin href="/web/assets/index-C5rU-8Ft.css">
  </head>
  <body class="bg-canvas text-ink-primary antialiased selection:bg-accent-soft selection:text-accent-ink">
    <div id="root"></div>
  </body>
</html>
